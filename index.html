<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f7f5ef">
  <meta name="description" content="Portfólio de Luiz Trix — Design e Fotografia.">
  <title>Luiz Trix — Portfólio</title>
  <style>
    :root {
      --paper: #f7f5ef;
      --ink: #20201e;
      --muted: #85837d;
      --accent: #f2bd00;
      --line: #dedbd2;
    }

    * { box-sizing: border-box; }

    html, body { min-height: 100%; }

    body {
      margin: 0;
      background: var(--paper);
      color: var(--ink);
      font-family: Arial, Helvetica, sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    .page {
      min-height: 100svh;
      display: grid;
      grid-template-rows: auto 1fr auto;
      padding: clamp(26px, 4vw, 64px) clamp(24px, 6vw, 96px) clamp(22px, 3vw, 44px);
      position: relative;
      overflow: hidden;
    }

    .topbar, .footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
      position: relative;
      z-index: 1;
    }

    .brand {
      display: inline-flex;
      align-items: center;
      gap: 15px;
      font-size: 14px;
      font-weight: 700;
      letter-spacing: .22em;
      text-transform: uppercase;
      white-space: nowrap;
    }

    .brand-mark {
      width: 7px;
      height: 7px;
      background: var(--accent);
      display: inline-block;
      transform: rotate(45deg);
    }

    .top-note, .footer {
      color: var(--muted);
      font-size: 10px;
      letter-spacing: .2em;
      text-transform: uppercase;
    }

    main {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 56px 0 72px;
    }

    .welcome {
      width: min(100%, 980px);
      text-align: center;
      transform: translateY(-1.5%);
    }

    .eyebrow {
      color: var(--muted);
      font-size: 11px;
      letter-spacing: .34em;
      text-transform: uppercase;
      margin: 0 0 24px;
    }

    h1 {
      margin: 0;
      font-family: Georgia, "Times New Roman", serif;
      font-size: clamp(58px, 9vw, 126px);
      line-height: .92;
      font-weight: 700;
      letter-spacing: -.065em;
    }

    .rule {
      width: 54px;
      height: 4px;
      background: var(--accent);
      margin: 34px auto 28px;
    }

    .question {
      margin: 0;
      color: var(--muted);
      font-size: clamp(13px, 1.4vw, 18px);
      font-weight: 400;
      letter-spacing: .19em;
      text-transform: uppercase;
    }

    .choices {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: clamp(14px, 2vw, 26px);
      margin: 46px auto 0;
    }

    .choice {
      min-width: 190px;
      min-height: 58px;
      padding: 0 34px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 18px;
      border: 1px solid var(--ink);
      border-radius: 2px;
      background: var(--ink);
      color: var(--paper);
      text-decoration: none;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: .2em;
      text-transform: uppercase;
      transition: background .22s ease, color .22s ease, transform .22s ease, border-color .22s ease;
    }

    .choice::after {
      content: "↗";
      color: var(--accent);
      font-size: 16px;
      line-height: 1;
      transition: transform .22s ease;
    }

    .choice:hover, .choice:focus-visible {
      background: transparent;
      color: var(--ink);
      border-color: var(--accent);
      transform: translateY(-3px);
      outline: none;
    }

    .choice:hover::after, .choice:focus-visible::after {
      transform: translate(2px, -2px);
    }

    .footer {
      border-top: 1px solid var(--line);
      padding-top: 19px;
    }

    .footer span:last-child {
      color: var(--ink);
      font-weight: 700;
    }

    @media (max-width: 620px) {
      .page { padding: 24px 22px 20px; }
      .top-note { display: none; }
      main { padding: 48px 0 60px; }
      .welcome { transform: none; }
      h1 { font-size: clamp(54px, 16vw, 86px); }
      .eyebrow { margin-bottom: 20px; }
      .rule { margin: 28px auto 24px; }
      .question { line-height: 1.7; letter-spacing: .12em; }
      .choices { flex-direction: column; gap: 13px; margin-top: 34px; width: 100%; }
      .choice { width: min(100%, 300px); min-height: 54px; }
      .footer { font-size: 8px; letter-spacing: .12em; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { transition: none !important; }
    }
  
/* Navegação global: retorno ao topo */
.back-to-top{position:fixed;right:26px;bottom:26px;z-index:50;width:48px;height:48px;border:1px solid rgba(166,226,46,.72);border-radius:50%;background:rgba(10,14,11,.88);color:#A6E22E;display:flex;align-items:center;justify-content:center;font-size:23px;line-height:1;cursor:pointer;opacity:0;visibility:hidden;transform:translateY(10px);transition:opacity .25s,visibility .25s,transform .25s,background .25s;backdrop-filter:blur(8px)}
.back-to-top.visible{opacity:1;visibility:visible;transform:translateY(0)}
.back-to-top:hover{background:#A6E22E;color:#101510}
@media(max-width:620px){.back-to-top{right:15px;bottom:15px;width:44px;height:44px}}

</style>
</head>
<body>
  <div class="page">
    <header class="topbar">
      <div class="brand"><span class="brand-mark" aria-hidden="true"></span> Luiz Trix</div>
      <div class="top-note">Portfólio · Belo Horizonte</div>
    </header>

    <main>
      <section class="welcome" aria-labelledby="welcome-title">
        <p class="eyebrow">Design &amp; Fotografia</p>
        <h1 id="welcome-title">Bem-vindo.</h1>
        <div class="rule" aria-hidden="true"></div>
        <p class="question">O que deseja ver hoje?</p>

        <nav class="choices" aria-label="Escolha uma área do portfólio">
          <!-- Troque os destinos abaixo pelos endereços das páginas quando estiverem prontas. -->
          <a class="choice" href="luiz-trix-design.html">Design</a>
          <a class="choice" href="fotografia.html">Fotografia</a>
        </nav>
      </section>
    </main>

    <footer class="footer">
      <span>Identidade · Imagem · Experiência</span>
      <span>Luiz Trix © 2026</span>
    </footer>
  </div>

<button class="back-to-top" id="backToTop" type="button" aria-label="Voltar ao topo" title="Voltar ao topo">↑</button>
<script>
(()=>{const b=document.getElementById('backToTop');if(!b)return;const update=()=>b.classList.toggle('visible',window.scrollY>320);window.addEventListener('scroll',update,{passive:true});update();b.addEventListener('click',()=>window.scrollTo({top:0,behavior:'smooth'}));})();
</script>

</body>
</html>
